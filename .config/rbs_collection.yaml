# Download sources
sources:
  - type: git
    name: ruby/gem_rbs_collection
    remote: https://github.com/ruby/gem_rbs_collection.git
    revision: main
    repo_dir: gems

# You can specify local directories as sources also.
# - type: local
#   path: path/to/your/local/repository

# A directory to install the downloaded RBSs
path: .gem_rbs_collection

# Rugged and WhatLanguage are not published in gem_rbs_collection,
# so they are covered by the hand-written sig/rugged.rbs and sig/whatlanguage.rbs.
gems:
  - name: commonmarker
  - name: strscan
