# Download sources
sources:
  - type: git
    name: ruby/gem_rbs_collection
    remote: https://github.com/ruby/gem_rbs_collection.git
    revision: main
    repo_dir: gems

# You can specify local directories as sources also.
# - type: local
#   path: path/to/your/local/repository

# A directory to install the downloaded RBSs
path: .gem_rbs_collection

# Commonmarker is published in gem_rbs_collection only as a v1-targeted,
# untyped signature, which matches neither the installed gem nor its API.
# Rugged and WhatLanguage are not published there at all.
# All three are therefore covered by hand-written signatures under sig/,
# and are excluded from auto-assignment even if upstream publishes them.
gems:
  - name: commonmarker
    ignore: true
  - name: nokogiri
  - name: rugged
    ignore: true
  - name: whatlanguage
    ignore: true
